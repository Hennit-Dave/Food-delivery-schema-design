<style>
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">Final entity relationship diagram for the food delivery data model with deletedAt on soft-deleted entities</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  CUSTOMER ||--o{ ORDER : places
  RESTAURANT ||--o{ MENUITEM : offers
  RESTAURANT ||--o{ ORDER : receives
  ORDER ||--|{ ORDERITEM : contains
  MENUITEM ||--o{ ORDERITEM : "ordered as"
  ORDER ||--o| DELIVERY : has
  COURIER ||--o{ DELIVERY : delivers
  ORDER ||--o| REVIEW : has

  CUSTOMER {
    uuid id PK
    string name
    string email
    timestamp createdAt
    timestamp updatedAt
    timestamp deletedAt "nullable"
  }
  RESTAURANT {
    uuid id PK
    string name
    json pickupAddress
    timestamp createdAt
    timestamp updatedAt
    timestamp deletedAt "nullable"
  }
  COURIER {
    uuid id PK
    string name
    string phone
    timestamp createdAt
    timestamp updatedAt
    timestamp deletedAt "nullable"
  }
  MENUITEM {
    uuid id PK
    uuid restaurantId FK
    string name
    string description
    int priceMinor
    string currency
    boolean isAvailable
    timestamp createdAt
    timestamp updatedAt
    timestamp deletedAt "nullable"
  }
  ORDER {
    uuid id PK
    uuid customerId FK
    uuid restaurantId FK
    string status
    json deliveryAddressSnapshot
    int totalMinor
    string currency
    timestamp createdAt
    timestamp updatedAt
  }
  ORDERITEM {
    uuid id PK
    uuid orderId FK
    uuid menuItemId FK
    int quantity
    int unitPriceMinor
    string currency
    timestamp createdAt
    timestamp updatedAt
  }
  DELIVERY {
    uuid id PK
    uuid orderId FK
    uuid courierId FK
    timestamp assignedAt
    timestamp pickedUpAt
    timestamp deliveredAt
    timestamp createdAt
    timestamp updatedAt
  }
  REVIEW {
    uuid id PK
    uuid orderId FK
    int rating
    string comment
    timestamp createdAt
    timestamp updatedAt
    timestamp deletedAt "nullable"
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
