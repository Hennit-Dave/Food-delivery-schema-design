<style>
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
<h2 class="sr-only">Revised state diagram of the Order lifecycle starting at placed, with payment removed</h2>
<div id="order-sm"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `stateDiagram-v2
    [*] --> placed
    placed --> accepted
    placed --> cancelled: Customer cancels or restaurant rejects
    accepted --> preparing
    preparing --> ready
    ready --> picked_up
    picked_up --> delivered
    cancelled --> [*]
    delivered --> [*]`;
const { svg } = await mermaid.render('order-sm-svg', src);
document.getElementById('order-sm').innerHTML = svg;
</script>
